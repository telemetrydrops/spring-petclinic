---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      otlp/lgtm:
        endpoint: lgtm:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/lgtm]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/lgtm]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/lgtm]
