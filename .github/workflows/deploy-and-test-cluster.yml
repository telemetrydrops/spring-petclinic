name: Deploy and Test Cluster

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-and-test-cluster.yml'
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-and-test-cluster.yml'

jobs:
  deploy-and-test-cluster:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU for the amd64 Petclinic image
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: amd64

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      - name: Deploy application
        run: |
          kubectl --context kind-chart-testing apply -f k8s/

      - name: Wait for Pods to be ready
        run: |
          kubectl --context kind-chart-testing wait --for=condition=ready pod -l app=demo-db --timeout=180s
          kubectl --context kind-chart-testing wait --for=condition=ready pod -l app=petclinic --timeout=180s

